name = "budgetapp-plaid"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Only the main workers.dev URL is needed; skip per-version preview URLs.
preview_urls = false

[vars]
PLAID_ENV = "production"
ANDROID_PACKAGE_NAME = "com.edwinnava.budgetapp"

# Secrets (set with `npx wrangler secret put <NAME>`, never commit them):
#   PLAID_CLIENT_ID, PLAID_SECRET, APP_SECRET
